name: Monitor mobility sources (observe only)

# AUTO-01B: observation plus one persistent GitHub issue. It cannot edit inputs, create releases/PRs, build graphs or deploy.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      territory:
        description: "Folder under territories/ containing sources.json and monitor.json"
        required: true
        default: milano-test
      source:
        description: "Source type to observe"
        required: true
        type: choice
        options:
          - gtfs

permissions:
  contents: read

concurrency:
  group: monitor-source-${{ inputs.territory || 'milano-test' }}-${{ inputs.source || 'gtfs' }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TERRITORY: ${{ inputs.territory || 'milano-test' }}
      SOURCE: ${{ inputs.source || 'gtfs' }}
      REPORT: meta/source-candidate-report.json
    steps:
      - name: Check out the pipeline without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate monitor configuration
        run: |
          set -euo pipefail
          [[ "$TERRITORY" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]] || { echo "::error::invalid territory"; exit 1; }
          [[ "$SOURCE" == "gtfs" ]] || { echo "::error::AUTO-01A supports gtfs only"; exit 1; }
          sources="territories/$TERRITORY/sources.json"
          monitor="territories/$TERRITORY/monitor.json"
          [[ -f "$sources" && -f "$monitor" ]] || { echo "::error::territory has no sources.json and monitor.json"; exit 1; }
          jq -e --arg territory "$TERRITORY" '.territory == $territory and .gtfs.publisherUrl != null and .gtfs.sha256 != null' "$sources" >/dev/null
          jq -e --arg territory "$TERRITORY" '.schema == "source-monitor-v1" and .territory == $territory and .gtfs.enabled == true' "$monitor" >/dev/null
          attempts=$(jq -r '.gtfs.download.maximumAttempts' "$monitor")
          connect_timeout=$(jq -r '.gtfs.download.connectTimeoutSeconds' "$monitor")
          maximum_time=$(jq -r '.gtfs.download.maximumTimeSeconds' "$monitor")
          retry_delay=$(jq -r '.gtfs.download.retryDelaySeconds' "$monitor")
          [[ "$attempts" =~ ^[1-3]$ && "$connect_timeout" =~ ^[0-9]+$ && "$maximum_time" =~ ^[0-9]+$ && "$retry_delay" =~ ^[0-9]+$ ]] || {
            echo "::error::invalid bounded download policy"; exit 1;
          }
          mkdir -p work/monitor meta

      - name: Download once and classify the GTFS candidate
        run: |
          set -euo pipefail
          sources="territories/$TERRITORY/sources.json"
          monitor="territories/$TERRITORY/monitor.json"
          url=$(jq -er '.gtfs.publisherUrl | select(startswith("https://"))' "$sources")
          attempts=$(jq -r '.gtfs.download.maximumAttempts' "$monitor")
          retries=$((attempts - 1))
          connect_timeout=$(jq -r '.gtfs.download.connectTimeoutSeconds' "$monitor")
          maximum_time=$(jq -r '.gtfs.download.maximumTimeSeconds' "$monitor")
          retry_delay=$(jq -r '.gtfs.download.retryDelaySeconds' "$monitor")
          set +e
          curl -fsSL --retry "$retries" --retry-all-errors --retry-delay "$retry_delay" \
            --connect-timeout "$connect_timeout" --max-time "$maximum_time" \
            -o work/monitor/gtfs-candidate.zip "$url"
          download_status=$?
          set -e
          if [[ "$download_status" -eq 0 ]]; then
            node scripts/check-source-candidate.mjs --sources "$sources" --monitor "$monitor" --source "$SOURCE" \
              --download-status available --candidate work/monitor/gtfs-candidate.zip --out "$REPORT"
          else
            rm -f work/monitor/gtfs-candidate.zip
            node scripts/check-source-candidate.mjs --sources "$sources" --monitor "$monitor" --source "$SOURCE" \
              --download-status unavailable --download-error "curl-exit-$download_status" --out "$REPORT"
          fi

      - name: Package only a new verified candidate
        id: candidate
        run: |
          set -euo pipefail
          node scripts/monitor-candidate-artifact.mjs --operation package \
            --report "$REPORT" --candidate work/monitor/gtfs-candidate.zip --directory work/monitor/promotion-candidate \
            --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/monitor-sources.yml \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" --territory "$TERRITORY" --source "$SOURCE" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out meta/candidate-retention.json
          echo "available=$(jq -r .available meta/candidate-retention.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(jq -r '.artifactName // ""' meta/candidate-retention.json)" >> "$GITHUB_OUTPUT"

      - name: Retain the new verified candidate for manual promotion
        id: preserve
        if: steps.candidate.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: work/monitor/promotion-candidate/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Write the readable summary
        if: always()
        run: |
          set -euo pipefail
          [[ -f "$REPORT" ]] || { echo "::error::the monitor produced no report"; exit 1; }
          state=$(jq -r .state "$REPORT")
          {
            echo "### Mobility source monitor — $state"
            echo "- territory: \`$(jq -r .territory "$REPORT")\`"
            echo "- source: \`$(jq -r .source "$REPORT")\`"
            echo "- acquisition: \`$(jq -r .acquisition.status "$REPORT")\`"
            echo "- current SHA-256: \`$(jq -r .current.sha256 "$REPORT")\`"
            echo "- candidate SHA-256: \`$(jq -r '.candidate.sha256 // "not available"' "$REPORT")\`"
            echo "- ZIP integrity: \`$(jq -r .integrity.zip "$REPORT")\`"
            echo "- licence: \`$(jq -r .license.verdict "$REPORT")\`"
            echo "- effective last service date: \`$(jq -r '.expiry.lastServiceDate // "unknown"' "$REPORT")\`"
            echo "- days remaining: \`$(jq -r '.expiry.daysRemaining // "unknown"' "$REPORT")\`"
            echo "- observe-only: no input mutation, release, build or deployment"
            if [[ -f meta/candidate-retention.json && "$(jq -r .available meta/candidate-retention.json)" == "true" ]]; then
              if [[ "${{ steps.preserve.outcome }}" == "success" ]]; then
                echo "- promotion candidate: **AVAILABLE** as \`$(jq -r .artifactName meta/candidate-retention.json)\` for 3 days"
              else
                echo "- promotion candidate: **NOT AVAILABLE** — temporary artifact upload failed"
              fi
            else
              echo "- promotion candidate: not retained ($(jq -r '.reason // "packaging failed"' meta/candidate-retention.json 2>/dev/null || echo "packaging failed"))"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f meta/candidate-retention.json && "$(jq -r .available meta/candidate-retention.json)" == "true" && "${{ steps.preserve.outcome }}" != "success" ]]; then
            echo "::error::the verified candidate could not be retained and is not available for promotion"
          fi
          case "$state" in
            EXPIRING) echo "::warning::GTFS is approaching its effective last service date" ;;
            UNAVAILABLE|UPDATED_INVALID|LICENSE_UNKNOWN|EXPIRED) echo "::error::source monitor state is $state" ;;
          esac

      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-monitor-${{ github.run_id }}
          path: meta/source-candidate-report.json
          retention-days: 3
          if-no-files-found: error

      - name: Fail only for blocking observations
        if: always()
        run: |
          set -euo pipefail
          state=$(jq -r .state "$REPORT")
          case "$state" in
            UNAVAILABLE|UPDATED_INVALID|LICENSE_UNKNOWN|EXPIRED) exit 1 ;;
            UNCHANGED|UPDATED_VALID|EXPIRING) exit 0 ;;
            *) echo "::error::unknown monitor state: $state"; exit 1 ;;
          esac

  notify:
    name: Synchronize persistent source issue
    if: ${{ always() }}
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the notification code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the immutable monitor report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-monitor-${{ github.run_id }}
          path: meta

      - name: Synchronize the persistent issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-monitor-issue.mjs --report meta/source-candidate-report.json --out meta/issue-sync-result.json

      - name: Record notification outcome
        if: always()
        run: |
          if [[ -f meta/issue-sync-result.json ]]; then
            action=$(jq -r .action meta/issue-sync-result.json)
            issue=$(jq -r '.issueNumber // "none"' meta/issue-sync-result.json)
            duplicates=$(jq -r .duplicatesClosed meta/issue-sync-result.json)
            {
              echo "### Persistent issue synchronization — $action"
              echo "- issue: \`$issue\`"
              echo "- duplicate issues closed: \`$duplicates\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Persistent issue synchronization — FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GitHub issue synchronization failed; the monitor report remains available as a workflow artifact"
          fi
