name: Promote verified GTFS input

# AUTO-01C: manual acquisition only. Validates again, publishes an immutable input and opens an unmerged metadata PR.
on:
  workflow_dispatch:
    inputs:
      territory:
        description: "Folder under territories/ containing sources.json and monitor.json"
        required: true
        default: milano-test
      source:
        description: "Approved source type to acquire"
        required: true
        type: choice
        options:
          - gtfs
      acquisition_mode:
        description: "Acquire directly from the publisher or reuse one verified monitor run"
        required: true
        type: choice
        default: direct
        options:
          - direct
          - monitor_artifact
      monitor_run_id:
        description: "Required only for monitor_artifact: exact AUTO-01B run ID"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: promote-source-${{ inputs.territory }}-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  validate:
    name: Acquire and validate without mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      promote: ${{ steps.gate.outputs.promote }}
    env:
      TERRITORY: ${{ inputs.territory }}
      SOURCE: ${{ inputs.source }}
      REPORT: promotion/report.json
      CANDIDATE: promotion/candidate.zip
    steps:
      - name: Check out the pipeline without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate acquisition configuration
        run: |
          set -euo pipefail
          [[ "$TERRITORY" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]] || { echo "::error::invalid territory"; exit 1; }
          [[ "$SOURCE" == "gtfs" ]] || { echo "::error::AUTO-01C supports gtfs only"; exit 1; }
          mode="${{ inputs.acquisition_mode }}"
          monitor_run_id="${{ inputs.monitor_run_id }}"
          [[ "$mode" == "direct" || "$mode" == "monitor_artifact" ]] || { echo "::error::invalid acquisition mode"; exit 1; }
          if [[ "$mode" == "monitor_artifact" ]]; then
            [[ "$monitor_run_id" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "::error::monitor_run_id must be a positive integer in monitor_artifact mode"; exit 1; }
          elif [[ -n "$monitor_run_id" ]]; then
            echo "::error::monitor_run_id must be empty in direct mode"; exit 1
          fi
          sources="territories/$TERRITORY/sources.json"
          monitor="territories/$TERRITORY/monitor.json"
          [[ -f "$sources" && -f "$monitor" ]] || { echo "::error::territory has no sources.json and monitor.json"; exit 1; }
          jq -e --arg territory "$TERRITORY" '.territory == $territory and .gtfs.publisherUrl != null and .gtfs.sha256 != null' "$sources" >/dev/null
          jq -e --arg territory "$TERRITORY" '.schema == "source-monitor-v1" and .territory == $territory and .gtfs.enabled == true' "$monitor" >/dev/null
          attempts=$(jq -r '.gtfs.download.maximumAttempts' "$monitor")
          connect_timeout=$(jq -r '.gtfs.download.connectTimeoutSeconds' "$monitor")
          maximum_time=$(jq -r '.gtfs.download.maximumTimeSeconds' "$monitor")
          retry_delay=$(jq -r '.gtfs.download.retryDelaySeconds' "$monitor")
          [[ "$attempts" =~ ^[1-3]$ && "$connect_timeout" =~ ^[0-9]+$ && "$maximum_time" =~ ^[0-9]+$ && "$retry_delay" =~ ^[0-9]+$ ]] || {
            echo "::error::invalid bounded download policy"; exit 1;
          }
          mkdir -p promotion

      - name: Download the official source directly
        id: direct
        if: inputs.acquisition_mode == 'direct'
        run: |
          set -euo pipefail
          sources="territories/$TERRITORY/sources.json"
          monitor="territories/$TERRITORY/monitor.json"
          url=$(jq -er '.gtfs.publisherUrl | select(startswith("https://"))' "$sources")
          attempts=$(jq -r '.gtfs.download.maximumAttempts' "$monitor")
          retries=$((attempts - 1))
          connect_timeout=$(jq -r '.gtfs.download.connectTimeoutSeconds' "$monitor")
          maximum_time=$(jq -r '.gtfs.download.maximumTimeSeconds' "$monitor")
          retry_delay=$(jq -r '.gtfs.download.retryDelaySeconds' "$monitor")
          set +e
          curl -fsSL --retry "$retries" --retry-all-errors --retry-delay "$retry_delay" \
            --connect-timeout "$connect_timeout" --max-time "$maximum_time" -o "$CANDIDATE" "$url"
          download_status=$?
          set -e
          if [[ "$download_status" -eq 0 ]]; then
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$CANDIDATE"
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            node scripts/check-source-candidate.mjs --sources "$sources" --monitor "$monitor" --source "$SOURCE" \
              --download-status unavailable --download-error "curl-exit-$download_status" --out "$REPORT"
          fi

      - name: Resolve the exact authorized monitor artifact
        id: resolve
        if: inputs.acquisition_mode == 'monitor_artifact'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/monitor-candidate-artifact.mjs --operation resolve \
            --run-id "${{ inputs.monitor_run_id }}" --territory "$TERRITORY" --source "$SOURCE" \
            --out promotion/resolution.json
          echo "artifact_name=$(jq -r .artifactName promotion/resolution.json)" >> "$GITHUB_OUTPUT"

      - name: Download only the resolved monitor artifact
        if: inputs.acquisition_mode == 'monitor_artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: monitor-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.monitor_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Verify monitor artifact provenance and content identity
        if: inputs.acquisition_mode == 'monitor_artifact'
        run: |
          set -euo pipefail
          node scripts/monitor-candidate-artifact.mjs --operation verify \
            --resolution promotion/resolution.json --origin monitor-candidate/origin.json \
            --report monitor-candidate/report.json --candidate monitor-candidate/candidate.zip \
            --repository "$GITHUB_REPOSITORY" --run-id "${{ inputs.monitor_run_id }}" \
            --territory "$TERRITORY" --source "$SOURCE" --out promotion/artifact-verification.json
          cp monitor-candidate/candidate.zip "$CANDIDATE"

      - name: Validate the selected candidate again
        if: inputs.acquisition_mode == 'monitor_artifact' || steps.direct.outputs.downloaded == 'true'
        run: |
          set -euo pipefail
          node scripts/check-source-candidate.mjs --sources "territories/$TERRITORY/sources.json" \
            --monitor "territories/$TERRITORY/monitor.json" --source "$SOURCE" \
            --download-status available --candidate "$CANDIDATE" --out "$REPORT"

      - name: Gate immutable promotion
        id: gate
        run: |
          set -euo pipefail
          echo "promote=false" >> "$GITHUB_OUTPUT"
          state=$(jq -r .state "$REPORT")
          change=$(jq -r .candidate.change "$REPORT")
          current_until=$(jq -r '.gtfs.validUntil' "territories/$TERRITORY/sources.json")
          candidate_until=$(jq -r '.validity.effective.lastServiceDate // ""' "$REPORT")
          {
            echo "### GTFS acquisition gate — $state"
            echo "- candidate change: \`$change\`"
            echo "- candidate SHA-256: \`$(jq -r '.candidate.sha256 // "not available"' "$REPORT")\`"
            echo "- ZIP integrity: \`$(jq -r .integrity.zip "$REPORT")\`"
            echo "- licence: \`$(jq -r .license.verdict "$REPORT")\`"
            echo "- effective service: \`$(jq -r '.validity.effective.firstServiceDate // "unknown"' "$REPORT")\` through \`$(jq -r '.validity.effective.lastServiceDate // "unknown"' "$REPORT")\`"
            echo "- currently approved last service date: \`$current_until\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$change" == "UNCHANGED" && ( "$state" == "UNCHANGED" || "$state" == "EXPIRING" ) ]]; then
            echo "No promotion: the official feed is unchanged."
            exit 0
          fi
          if [[ "$change" == "UPDATED" && ( "$state" == "UPDATED_VALID" || "$state" == "EXPIRING" ) ]]; then
            if [[ ! "$current_until" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || ! "$candidate_until" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "- result: **BLOCKED** — effective last service date is missing or invalid" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::effective last service date is missing or invalid"
              exit 1
            fi
            if [[ "$candidate_until" < "$current_until" ]]; then
              echo "- result: **BLOCKED** — temporal regression: candidate ends on \`$candidate_until\`, before current approved \`$current_until\`" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::GTFS temporal regression: candidate last service date $candidate_until precedes current approved $current_until"
              exit 1
            fi
            echo "promote=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::candidate is not promotable: state=$state change=$change"
          exit 1

      - name: Preserve the validation report
        if: always() && hashFiles('promotion/report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtfs-promotion-report-${{ github.run_id }}
          path: promotion/report.json
          retention-days: 3
          if-no-files-found: error

      - name: Explain a rejected acquisition without fallback
        if: failure()
        run: |
          {
            echo "### Acquisition mode failure"
            echo "- requested mode: \`${{ inputs.acquisition_mode }}\`"
            echo "- monitor run ID: \`${{ inputs.monitor_run_id || 'not applicable' }}\`"
            echo "- no fallback to another artifact or to the publisher was attempted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer only a valid updated candidate
        if: steps.gate.outputs.promote == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtfs-promotion-candidate-${{ github.run_id }}
          path: promotion/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  promote:
    name: Publish immutable input and prepare PR
    needs: validate
    if: needs.validate.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out promotion code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the validated candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: gtfs-promotion-candidate-${{ github.run_id }}
          path: promotion
          digest-mismatch: error

      - name: Reverify, publish and open the unmerged PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/promote-gtfs-candidate.mjs \
            --sources "territories/${{ inputs.territory }}/sources.json" \
            --report promotion/report.json --candidate promotion/candidate.zip \
            --base-sha "$GITHUB_SHA" --out promotion/result.json

      - name: Summarize promotion
        if: always()
        run: |
          if [[ -f promotion/result.json ]]; then
            {
              echo "### GTFS promotion — $(jq -r .action promotion/result.json)"
              echo "- SHA-256: \`$(jq -r .sha256 promotion/result.json)\`"
              echo "- Release: $(jq -r '.releaseUrl // "not created"' promotion/result.json)"
              echo "- Pull request: $(jq -r '.pullUrl // "not created"' promotion/result.json)"
              echo "- no graph build or deployment was requested"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### GTFS promotion — FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::promotion failed; sources on main were not modified"
          fi
